<!DOCTYPE html>

    <style>
        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0A0A0A;
            color: white;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        .cocktail-card {
            transition: transform 0.2s, box-shadow 0.2s;

</head>
<body>
    <div id="root"></div>

    <script>
        // Mock data for recipes
        const mockRecipes = [
            { id: 1, name: "Negroni", category: "Classics", glass: "Old Fashioned", garnishes: "Orange peel", ice: "Large cube", instructions: "Stir all ingredients with ice, strain into glass over fresh ice.", ingredients: [{ name: "Gin", amount: "1 oz" }, { name: "Campari", amount: "1 oz" }, { name: "Sweet Vermouth", amount: "1 oz" }], abv: "24%", cost: "$3.50", image: "🍹" },
            { id: 2, name: "Margarita", category: "Sours", glass: "Coupe", garnishes: "Lime wheel", ice: "None", instructions: "Shake all ingredients with ice, strain into glass.", ingredients: [{ name: "Tequila", amount: "2 oz" }, { name: "Lime Juice", amount: "1 oz" }, { name: "Orange Liqueur", amount: "0.75 oz" }], abv: "18%", cost: "$4.00", image: "🍸" },
            { id: 3, name: "Old Fashioned", category: "Classics", glass: "Old Fashioned", garnishes: "Orange peel, cherry", ice: "Large cube", instructions: "Muddle sugar and bitters, add whiskey and ice, stir.", ingredients: [{ name: "Bourbon", amount: "2 oz" }, { name: "Sugar Cube", amount: "1" }, { name: "Angostura Bitters", amount: "2 dashes" }], abv: "35%", cost: "$5.00", image: "🥃" },

        // Layout Component

                                React.createElement('span', { className: "text-2xl font-bold text-[#FFB366]" }, mockRecipes.length)

                                React.createElement('span', null, "Syrups & Infusions"),
                                React.createElement('span', { className: "text-2xl font-bold text-[#FFB366]" }, mockSyrups.length)
                            ),
                            React.createElement('div', { className: "flex justify-between items-center" },
                                React.createElement('span', null, "Categories"),

                                React.createElement('div', { className: "p-6" },
                                    React.createElement('div', { className: "text-4xl mb-3" }, recipe.image),
                                    React.createElement('h3', { className: "text-xl font-bold mb-2" }, recipe.name),
                                    React.createElement('p', { className: "text-white/60 text-sm mb-3" }, recipe.category),
                                    React.createElement('div', { className: "flex justify-between text-sm" },
                                        React.createElement('span', { className: "text-[#FFB366]" }, recipe.abv, " ABV"),
                                        React.createElement('span', { className: "text-white/60" }, recipe.cost)
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }

        function RecipesPage() {
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filterCategory, setFilterCategory] = React.useState('All');
            
            const categories = ['All', ...new Set(mockRecipes.map(r => r.category))];
            const filteredRecipes = mockRecipes.filter(recipe => {
                const matchesSearch = recipe.name.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesCategory = filterCategory === 'All' || recipe.category === filterCategory;
                return matchesSearch && matchesCategory;
            });

            return React.createElement('div', { className: "max-w-6xl mx-auto" },
                React.createElement('h1', { className: "text-3xl font-bold mb-8" }, "📖 All Recipes"),
                
                React.createElement('div', { className: "flex flex-col md:flex-row gap-4 mb-8" },
                    React.createElement('input', {
                        type: "text",
                        placeholder: "🔍 Search recipes...",
                        value: searchTerm,
                        onChange: (e) => setSearchTerm(e.target.value),
                        className: "flex-1 bg-white/10 border border-white/20 rounded-lg px-4 py-2 focus:outline-none focus:border-[#FFB366]"
                    }),
                    React.createElement('select', {
                        value: filterCategory,
                        onChange: (e) => setFilterCategory(e.target.value),
                        className: "bg-white/10 border border-white/20 rounded-lg px-4 py-2 focus:outline-none focus:border-[#FFB366]"

                    filteredRecipes.map(recipe => 
                        React.createElement('div', { key: recipe.id, className: "cocktail-card bg-white/5 rounded-xl overflow-hidden hover:bg-white/10 transition-all cursor-pointer", onClick: () => window.dispatchEvent(new CustomEvent('navigate', { detail: `/recipe/${recipe.id}` })) },
                            React.createElement('div', { className: "p-6" },
                                React.createElement('div', { className: "text-5xl mb-3" }, recipe.image),
                                React.createElement('h3', { className: "text-xl font-bold mb-2" }, recipe.name),
                                React.createElement('p', { className: "text-white/60 text-sm mb-3" }, recipe.category),
                                React.createElement('div', { className: "flex justify-between text-sm" },
                                    React.createElement('span', { className: "text-[#FFB366]" }, recipe.abv),
                                    React.createElement('span', { className: "text-white/60" }, recipe.cost)
                                )
                            )
                        )
                    )
                ),
                
                filteredRecipes.length === 0 && React.createElement('div', { className: "text-center py-12 text-white/60" }, "No recipes found")
            );
        }

        function RecipeDetailPage({ recipeId }) {
            const recipe = mockRecipes.find(r => r.id === parseInt(recipeId));
            
            if (!recipe) {
                return React.createElement('div', { className: "text-center py-12" }, "Recipe not found");
            }
            
            return React.createElement('div', { className: "max-w-4xl mx-auto" },
                React.createElement('button', {
                    onClick: () => window.dispatchEvent(new CustomEvent('navigate', { detail: '/recipes' })),
                    className: "mb-6 text-white/60 hover:text-white transition-colors"
                }, "← Back to Recipes"),
                
                React.createElement('div', { className: "bg-white/5 rounded-xl p-8" },
                    React.createElement('div', { className: "text-6xl mb-4" }, recipe.image),
                    React.createElement('h1', { className: "text-3xl md:text-4xl font-bold mb-4" }, recipe.name),
                    React.createElement('p', { className: "text-[#FFB366] mb-6" }, recipe.category),
                    
                    React.createElement('div', { className: "grid md:grid-cols-2 gap-8 mb-8" },
                        React.createElement('div', null,
                            React.createElement('h2', { className: "text-xl font-bold mb-4" }, "Ingredients"),
                            React.createElement('ul', { className: "space-y-2" },
                                recipe.ingredients.map((ing, idx) => 
                                    React.createElement('li', { key: idx, className: "flex justify-between border-b border-white/10 py-2" },
                                        React.createElement('span', null, ing.name),
                                        React.createElement('span', { className: "text-[#FFB366]" }, ing.amount)
                                    )
                                )
                            )
                        ),
                        React.createElement('div', null,
                            React.createElement('div', { className: "mb-4" },
                                React.createElement('h3', { className: "font-semibold mb-1" }, "Glass"),
                                React.createElement('p', { className: "text-white/80" }, recipe.glass)
                            ),
                            React.createElement('div', { className: "mb-4" },
                                React.createElement('h3', { className: "font-semibold mb-1" }, "Garnish"),
                                React.createElement('p', { className: "text-white/80" }, recipe.garnishes)
                            ),
                            React.createElement('div', { className: "mb-4" },
                                React.createElement('h3', { className: "font-semibold mb-1" }, "Ice"),
                                React.createElement('p', { className: "text-white/80" }, recipe.ice)
                            )
                        )
                    ),
                    
                    React.createElement('div', null,
                        React.createElement('h2', { className: "text-xl font-bold mb-4" }, "Instructions"),
                        React.createElement('p', { className: "text-white/80 leading-relaxed" }, recipe.instructions)
                    ),
                    
                    React.createElement('div', { className: "mt-8 pt-6 border-t border-white/10 flex justify-between" },
                        React.createElement('div', null,
                            React.createElement('p', { className: "text-sm text-white/60" }, "ABV"),
                            React.createElement('p', { className: "text-xl font-bold text-[#FFB366]" }, recipe.abv)
                        ),
                        React.createElement('div', null,
                            React.createElement('p', { className: "text-sm text-white/60" }, "Cost"),
                            React.createElement('p', { className: "text-xl font-bold text-[#FFB366]" }, recipe.cost)
                        )
                    )
                )

        }

        function SyrupsPage() {
            return React.createElement('div', { className: "max-w-6xl mx-auto" },
                React.createElement('h1', { className: "text-3xl font-bold mb-8" }, "🍯 Syrups & Infusions"),
                React.createElement('div', { className: "grid md:grid-cols-2 lg:grid-cols-3 gap-6" },
                    mockSyrups.map(syrup => 
                        React.createElement('div', { key: syrup.id, className: "bg-white/5 rounded-xl p-6 hover:bg-white/10 transition-all" },
                            React.createElement('div', { className: "text-3xl mb-3" }, "🍯"),
                            React.createElement('h3', { className: "text-xl font-bold mb-2" }, syrup.name),
                            React.createElement('div', { className: "space-y-2 text-sm" },
                                React.createElement('p', null, React.createElement('span', { className: "text-white/60" }, "Ingredients: "), syrup.ingredients),
                                React.createElement('p', null, React.createElement('span', { className: "text-white/60" }, "Shelf Life: "), syrup.shelfLife),
                                React.createElement('p', null, React.createElement('span', { className: "text-white/60" }, "Storage: "), syrup.storage),
                                React.createElement('p', null, React.createElement('span', { className: "text-white/60" }, "Usage: "), syrup.usage)

        function SettingsPage() {
            const [role, setRole] = React.useState(localStorage.getItem('userRole') || 'admin');
            
            const handleRoleChange = (newRole) => {
                setRole(newRole);
                localStorage.setItem('userRole', newRole);

                React.createElement('div', { className: "bg-white/5 rounded-xl p-8" },
                    React.createElement('h2', { className: "text-xl font-bold mb-4" }, "User Settings"),
                    React.createElement('div', { className: "space-y-4" },
                        React.createElement('div', null,
                            React.createElement('label', { className: "block text-white/60 mb-2" }, "User Role (Demo)"),
                            React.createElement('select', {

        // Main App Component
        function App() {
            const [currentPath, setCurrentPath] = React.useState(window.location.pathname);
            
            React.useEffect(() => {
                const handleNavigate = (e) => {
                    setCurrentPath(e.detail);
                    window.history.pushState({}, '', e.detail);
                };
                
                const handlePopState = () => {
                    setCurrentPath(window.location.pathname);
                };
                
                window.addEventListener('navigate', handleNavigate);
                window.addEventListener('popstate', handlePopState);
                
                return () => {
                    window.removeEventListener('navigate', handleNavigate);
                    window.removeEventListener('popstate', handlePopState);
                };
            }, []);
            
            const renderPage = () => {
                if (currentPath === '/' || currentPath === '') return React.createElement(HomePage, null);
                if (currentPath === '/recipes') return React.createElement(RecipesPage, null);
                if (currentPath === '/syrups') return React.createElement(SyrupsPage, null);
                if (currentPath === '/create-recipe') return React.createElement(CreateRecipePage, null);
                if (currentPath === '/import') return React.createElement(ImportPage, null);
                if (currentPath === '/settings') return React.createElement(SettingsPage, null);
                if (currentPath.startsWith('/recipe/')) {
                    const recipeId = currentPath.split('/')[2];
                    return React.createElement(RecipeDetailPage, { recipeId });
                }
                
                return React.createElement('div', { className: "text-center py-12" },
                    React.createElement('h1', { className: "text-4xl font-bold mb-4" }, "404"),
                    React.createElement('p', { className: "text-white/60" }, "Page not found"),
                    React.createElement('button', {
                        onClick: () => window.dispatchEvent(new CustomEvent('navigate', { detail: '/' })),
                        className: "mt-6 px-6 py-2 bg-[#FFB366] text-[#0A0A0A] rounded-lg font-semibold hover:bg-[#FFA040] transition-colors"
                    }, "Go Home")
                );
            };
            
            return React.createElement(Layout, null, renderPage());
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App, null));
    </script>
</body>
</html>
